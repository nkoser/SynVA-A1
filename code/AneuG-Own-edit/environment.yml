name: aneug
channels:
  - pytorch
  - nvidia
  - pytorch3d
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - matplotlib
  - plotly
  - tqdm
  - networkx
  - pyyaml
  - pillow
  - opencv
  - open3d
  - pyvista
  - pymeshlab
  - trimesh
  - shapely
  - python-igraph
  - ipykernel
  - jupyterlab
  - ipywidgets
  - omegaconf
  - pytorch=2.1
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8  # remove for CPU-only installs
  - pytorch3d=0.7.8
  - pytorch-lightning
  - pip:
      - -f https://data.pyg.org/whl/torch-2.1.2+cu118.html
      - torch-geometric==2.6.1
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - torch-spline-conv
      - point-cloud-utils
      - skeletor
      - scikit-spatial
      - einops
      - numpy<2
      - timm==0.9.2
      - transformers==4.30.2
      - diffusers==0.18.2
      - webdataset==0.2.33
      - wandb
      - pythreejs
      - accelerate==0.20.3
      - tensorboard
